[platformio]
default_envs = esp32_demo

[env:esp32_demo]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<temperature_node.cpp>
lib_deps =
    adafruit/Adafruit INA219
build_flags =
    -D SIMULATION_MODE=1

; ESP32 chính: INA219, biến trở và module relay IN1 trên GPIO27.
[env:esp32_hardware]
extends = env:esp32_demo
build_flags =
    -D SIMULATION_MODE=0
    -D REQUIRE_TEMPERATURE_NODE=1

; Chỉ dùng để thử ESP32 chính khi chưa có ESP32+DHT11 bên cạnh.
; Bảo vệ quá nhiệt bị vô hiệu hóa trong môi trường này.
[env:esp32_hardware_no_temp]
extends = env:esp32_demo
build_flags =
    -D SIMULATION_MODE=0
    -D REQUIRE_TEMPERATURE_NODE=0

; Firmware cho ESP32 thứ hai đọc DHT11 và gửi nhiệt độ về ESP32 chính.
[env:temperature_node]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<temperature_node.cpp>
lib_deps =
    adafruit/DHT sensor library


