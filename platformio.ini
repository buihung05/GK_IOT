[platformio]
default_envs = esp32_demo

[env:esp32_demo]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<temperature_node.cpp>
lib_deps =
    adafruit/Adafruit INA219
build_flags =
    -D SIMULATION_MODE=1

; Dùng môi trường này khi đã đấu INA219, biến trở và MOSFET thật.
[env:esp32_hardware]
extends = env:esp32_demo
build_flags =
    -D SIMULATION_MODE=0

; Firmware cho ESP32 thứ hai đọc DHT11 và gửi nhiệt độ về ESP32 chính.
[env:temperature_node]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<temperature_node.cpp>
lib_deps =
    adafruit/DHT sensor library


